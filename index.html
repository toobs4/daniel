<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Daniel's Bar Mitzvah</title>
<meta name="description" content="Daniel's Bar Mitzvah · RSVP">
<meta property="og:title" content="Daniel's Bar Mitzvah">
<meta property="og:description" content="Kindly RSVP">
<meta property="og:type" content="website">
<meta property="og:image" content="https://toobs4.github.io/daniel/img/og.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #faf8f3;
    --card: #ffffff;
    --ink: #1c1a17;
    --muted: #6f6a62;
    --red: #b8262c;
    --red-soft: #f3dcdc;
    --line: #e6e0d6;
    --serif: "Cormorant Garamond", Georgia, serif;
    --sans: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--paper); color: var(--ink); font-family: var(--sans);
    font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 32px 16px 64px; }
  header { text-align: center; margin-bottom: 28px; }
  .bsd { font-family: var(--serif); color: var(--red); font-size: 15px; direction: rtl; }
  header img, .flyer .logo { mix-blend-mode: multiply; }
  header img { width: 150px; height: auto; margin: 8px auto 4px; display: block; }
  h1 { font-family: var(--serif); font-weight: 600; font-size: 44px; line-height: 1.05; margin: 6px 0 2px; }
  .sub { font-family: var(--serif); font-size: 21px; color: var(--ink); }
  .rule { width: 56px; height: 1px; background: var(--red); margin: 16px auto; border: 0; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 24px 20px; box-shadow: 0 1px 2px rgba(0,0,0,.03);
  }
  .card + .card { margin-top: 16px; }
  h2 { font-family: var(--serif); font-weight: 600; font-size: 26px; margin: 0 0 6px; color: var(--red); text-align: center; }
  p.lead { text-align: center; color: var(--muted); margin: 0 0 20px; }
  label { display: block; font-size: 13px; font-weight: 500; color: var(--muted); margin-bottom: 6px; letter-spacing: .02em; }
  .field { margin-bottom: 14px; }
  input[type=text], input[type=number] {
    width: 100%; font: inherit; font-size: 17px; padding: 12px 14px; border: 1px solid var(--line);
    border-radius: 10px; background: var(--paper); color: var(--ink); outline: none;
  }
  input:focus { border-color: var(--red); box-shadow: 0 0 0 3px var(--red-soft); }
  button {
    font: inherit; font-weight: 500; font-size: 16px; border: 0; border-radius: 10px; cursor: pointer;
    padding: 13px 18px; width: 100%; background: var(--red); color: #fff;
  }
  button:disabled { opacity: .6; cursor: default; }
  button.link { background: none; color: var(--red); width: auto; padding: 8px 4px; text-decoration: underline; }
  .msg { text-align: center; color: var(--muted); margin-top: 14px; min-height: 1.5em; }
  .msg.err { color: var(--red); }
  .flyer { width: 100%; height: auto; display: block; border-radius: 10px; border: 1px solid var(--line); }
  .welcome { font-family: var(--serif); font-size: 24px; text-align: center; margin: 0 0 16px; }
  .meal { border-top: 1px solid var(--line); padding: 16px 0 4px; }
  .meal:first-of-type { border-top: 0; padding-top: 4px; }
  .meal h3 { font-family: var(--serif); font-size: 21px; font-weight: 600; margin: 0; }
  .meal .when { color: var(--muted); font-size: 14px; margin-bottom: 10px; }
  .counts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .counts.one { grid-template-columns: 1fr; }
  .hint { color: var(--muted); font-size: 13px; text-align: center; margin: 4px 0 16px; }
  .summary { list-style: none; padding: 0; margin: 0 0 8px; }
  .summary li { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .summary li:last-child { border-bottom: 0; }
  .summary li { flex-wrap: wrap; row-gap: 8px; }
  .cal { flex-basis: 100%; display: flex; gap: 8px; }
  .cal a { flex: 1; text-align: center; font-size: 13px; font-weight: 500; color: var(--red); text-decoration: none;
    border: 1px solid var(--red); border-radius: 8px; padding: 7px 6px; background: #fff; }
  .cal a:active { background: var(--red-soft); }
  .center { text-align: center; }
  .hidden { display: none !important; }
  .flyer { border: 1.5px solid var(--red); outline: 1px solid #8a857c; outline-offset: -7px;
    border-radius: 2px; padding: 34px 22px 26px; text-align: center; background: var(--paper); }
  .flyer .bsd { margin-bottom: 4px; }
  .flyer .logo { width: 132px; height: auto; display: block; margin: 0 auto 10px; }
  .flyer .heading { font-family: var(--serif); color: var(--red); font-size: 22px; margin: 0; }
  .flyer .short { width: 44px; height: 1px; background: var(--red); margin: 10px auto 12px; }
  .flyer .name { font-family: var(--serif); font-weight: 600; font-size: 48px; line-height: 1; margin: 0; }
  .flyer .cel { font-family: var(--serif); font-size: 20px; margin: 2px 0 0; }
  .flyer .sec { border-top: 1px solid #e7b9bb; padding: 16px 0 10px; }
  .flyer .sec.first { border-top: 1px solid var(--red); margin-top: 20px; }
  .flyer .date { font-family: var(--serif); color: var(--muted); font-size: 19px; }
  .flyer .ev { font-family: var(--serif); color: var(--red); font-size: 22px; margin: 4px 0 2px; }
  .flyer .ln { font-family: var(--serif); color: var(--muted); font-size: 15px; line-height: 1.45; }
  .flyer .end { border-top: 1px solid var(--red); padding-top: 12px; font-family: var(--serif); color: var(--muted); font-size: 15px; }
  .rsvp-inline { margin: 12px auto 6px; max-width: 300px; background: #fff; border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 12px 2px; text-align: left; }
  .rsvp-inline .lbl { font-size: 11px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase;
    color: var(--red); margin-bottom: 8px; text-align: center; }
  .rsvp-inline .field { margin-bottom: 10px; }
  .rsvp-inline .field label { text-align: center; }
  .rsvp-inline input[type=number] { padding: 9px 12px; font-size: 16px; }
  .flyer .end button { max-width: 300px; }
  .choice { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
  .choice label { margin: 0; cursor: pointer; }
  .choice input { position: absolute; opacity: 0; pointer-events: none; }
  .choice span { display: block; text-align: center; padding: 10px 6px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--paper); color: var(--ink); font-size: 15px; font-weight: 500; }
  .choice input:checked + span { background: var(--red); border-color: var(--red); color: #fff; }
  .choice input:focus-visible + span { box-shadow: 0 0 0 3px var(--red-soft); }
  .decline { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 0 0 10px;
    font-size: 14px; font-weight: 500; color: var(--ink); cursor: pointer; letter-spacing: 0; }
  .decline input { width: 18px; height: 18px; margin: 0; accent-color: var(--red); cursor: pointer; }
  .rsvp-inline input[type=number]:disabled { opacity: .45; }
  .rsvp-inline input.invalid { border-color: var(--red); box-shadow: 0 0 0 3px var(--red-soft); }
  .rsvp-inline .lbl .tip { text-transform: none; letter-spacing: 0; color: var(--muted); font-size: 12px; }
  .rsvp-inline .help { font-size: 12px; color: var(--red); font-weight: 500; text-align: center; margin-top: 4px; }
  #withdraw-btn { display: block; margin: 6px auto 0; font-size: 14px; }
  #withdraw-btn.hidden { display: none !important; }
  footer { text-align: center; color: var(--muted); font-size: 13px; margin-top: 28px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="bsd">בס״ד</div>
    <img src="img/logo.jpg" alt="Tefillin illustration">
    <h1>Daniel</h1>
    <div class="sub">Celebrates his Bar Mitzvah</div>
    <hr class="rule">
  </header>

  <!-- Step 1: identify -->
  <section id="step-find" class="card">
    <h2>Find your invitation</h2>
    <p class="lead">Please enter your first and last name (parents only).</p>
    <form id="find-form" autocomplete="on" novalidate>
      <div class="field">
        <label for="first">First name</label>
        <input id="first" name="given-name" type="text" autocomplete="given-name" required>
      </div>
      <div class="field">
        <label for="last">Last name</label>
        <input id="last" name="family-name" type="text" autocomplete="family-name" required>
      </div>
      <button id="find-btn" type="submit">Continue</button>
    </form>
    <div id="find-msg" class="msg" role="status"></div>
  </section>

  <!-- Step 2: invitation with RSVP fields built in -->
  <section id="step-invite" class="hidden">
    <p id="welcome" class="welcome"></p>
    <form id="rsvp-form" class="flyer" novalidate>
      <div id="flyer-body"></div>
      <div id="rsvp-foot" class="end">
        <button id="send-btn" type="submit">Send my answer</button>
        <button id="withdraw-btn" class="link hidden" type="button">Withdraw my answer</button>
        <div id="send-msg" class="msg" role="status"></div>
      </div>
      <div id="noreply-foot" class="end hidden">No reply needed. We look forward to celebrating with you.</div>
    </form>
    <div class="center"><button class="link" id="not-me">Not you? Start over</button></div>
  </section>

  <!-- Step 3: confirmation -->
  <section id="step-done" class="hidden">
    <div class="card">
      <h2>Thank you!</h2>
      <p class="lead">Your answer has been recorded.</p>
      <ul id="summary" class="summary"></ul>
      <p class="hint">You can come back to this page anytime to change your answer.</p>
      <button id="edit-btn" type="button">Change my answer</button>
      <div class="center"><button id="withdraw-btn2" class="link" type="button">Withdraw my answer</button></div>
    </div>
  </section>

  
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbyADn53G59OAEKMClcmt8jZoF4op_aTsOzJ1bSNbeWSpH6GbGN-U0-pHa6mGXYMNXWZPQ/exec";
const $ = id => document.getElementById(id);
let guest = null;   // { first, last, data }

function show(id) {
  ["step-find", "step-invite", "step-done"].forEach(s => $(s).classList.toggle("hidden", s !== id));
  document.querySelector("header").classList.toggle("hidden", id === "step-invite");
  window.scrollTo({ top: 0, behavior: "smooth" });
}

async function api(params, body) {
  const url = body ? API : API + "?" + new URLSearchParams(params);
  const res = await fetch(url, body
    ? { method: "POST", body: JSON.stringify(body), headers: { "Content-Type": "text/plain;charset=utf-8" } }
    : {});
  if (!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}

const NOT_FOUND = "We couldn't find your invitation. Please contact Haim Elfersi.";

$("find-form").addEventListener("submit", async e => {
  e.preventDefault();
  const first = $("first").value.trim(), last = $("last").value.trim();
  const msg = $("find-msg");
  msg.className = "msg";
  if (!first || !last) { msg.textContent = "Please enter both your first and last name."; msg.classList.add("err"); return; }
  $("find-btn").disabled = true; msg.textContent = "Looking for your invitation…";
  try {
    const data = await api({ action: "lookup", first, last });
    if (data.status !== "ok") { msg.textContent = NOT_FOUND; msg.classList.add("err"); return; }
    guest = { first, last, data };
    msg.textContent = "";
    $("send-msg").textContent = "";
    renderInvite();
  } catch (err) {
    msg.textContent = "Something went wrong. Please try again in a moment."; msg.classList.add("err");
  } finally {
    $("find-btn").disabled = false;
  }
});

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

const MEAL_OF = it =>
  it.title === "Celebratory Dinner" ? "Dinner" :
  it.title === "Celebratory Lunch" ? "Lunch" :
  it.lines.indexOf("Brunch to follow") >= 0 ? "Brunch" :
  it.lines.indexOf("Kidush to follow") >= 0 ? "Kidush" : null;
const MEAL_LABEL = { Brunch: "Brunch", Dinner: "Dinner", Lunch: "Lunch", Kidush: "Kidush" };

function mealFields(m, d) {
  const prev = (d.previous && d.previous[m]) || {};
  const box = el("div", "rsvp-inline");
  box.append(el("div", "lbl", "RSVP"));
  if (d.kidsOnly) {
    const ch = el("div", "choice");
    [["1", "Coming"], ["0", "Not coming"]].forEach(([v, t]) => {
      const lab = el("label");
      const r = document.createElement("input");
      Object.assign(r, { type: "radio", name: m + "-k", value: v });
      if (prev.k !== undefined && prev.k !== "" && String(prev.k) === v) r.checked = true;
      lab.append(r, el("span", "", t));
      ch.append(lab);
    });
    box.append(ch);
    return box;
  }
  const grid = el("div", "counts");
  const mk = (kind, label) => {
    const f = el("div", "field");
    const id = m + "-" + kind;
    const l = el("label", "", label); l.htmlFor = id;
    const i = document.createElement("input");
    Object.assign(i, { id, type: "number", min: 0, max: 20, step: 1, inputMode: "numeric", required: true });
    if (prev[kind] !== undefined && prev[kind] !== "") i.value = prev[kind];
    f.append(l, i, el("div", "help hidden", "None? Enter 0")); return f;
  };
  if (!d.kidsOnly) grid.append(mk("a", "Adults"));
  grid.append(mk("k", "Kids"));
  box.append(grid);
  // One-line hint next to the RSVP title: "RSVP · Enter 0 if none".
  const tip = el("span", "tip", " \u00b7 Enter 0 if none");
  box.querySelector(".lbl").append(tip);
  // "Sorry, we can't make it": sets both counts to 0 and locks them.
  const dec = el("label", "decline");
  const cb = document.createElement("input");
  Object.assign(cb, { type: "checkbox", id: m + "-no" });
  dec.append(cb, document.createTextNode("Sorry, we can't make it"));
  box.append(dec);
  const inputs = grid.querySelectorAll("input");
  const clear = i => {
    i.classList.remove("invalid"); i.parentNode.querySelector(".help").classList.add("hidden");
    if (!document.querySelector("#rsvp-form input.invalid") && $("send-msg").classList.contains("err")) $("send-msg").textContent = "";
  };
  const apply = on => {
    inputs.forEach(i => { i.disabled = on; clear(i); });
    tip.classList.toggle("hidden", on);
  };
  cb.addEventListener("change", () => {
    inputs.forEach(i => { i.value = cb.checked ? "0" : ""; });
    apply(cb.checked);
  });
  inputs.forEach(i => i.addEventListener("input", () => clear(i)));
  if (String(prev.a) === "0" && String(prev.k) === "0") { cb.checked = true; apply(true); }
  return box;
}

function renderInvite() {
  const d = guest.data, f = d.flyer;
  $("welcome").textContent = "Welcome, " + d.greeting;
  const box = $("flyer-body");
  box.innerHTML = "";
  box.append(el("div", "bsd", "בס״ד"));
  const img = el("img", "logo"); img.src = "img/logo.jpg"; img.alt = ""; box.append(img);
  if (f.heading) box.append(el("p", "heading", f.heading), el("div", "short"));
  box.append(el("p", "name", "Daniel"), el("p", "cel", "Celebrates his Bar Mitzvah"));
  f.sections.forEach((sec, n) => {
    const s = el("div", n === 0 ? "sec first" : "sec");
    s.append(el("div", "date", sec.date));
    sec.items.forEach(it => {
      s.append(el("div", "ev", it.title));
      it.lines.forEach(l => s.append(el("div", "ln", l)));
      const m = MEAL_OF(it);
      if (m && d.meals.indexOf(m) >= 0) s.append(mealFields(m, d));
    });
    box.append(s);
  });
  const hasMeals = d.meals.length > 0;
  $("rsvp-foot").classList.toggle("hidden", !hasMeals);
  $("noreply-foot").classList.toggle("hidden", hasMeals);
  $("withdraw-btn").classList.toggle("hidden", !d.previous);
  $("send-btn").textContent = d.previous ? "Update my answer" : "Send my answer";
  show("step-invite");
}

$("rsvp-form").addEventListener("submit", async e => {
  e.preventDefault();
  const d = guest.data, msg = $("send-msg");
  msg.className = "msg";
  const counts = {}, bad = [];
  const ok = v => /^\d{1,2}$/.test(v) && +v <= 20;
  for (const m of d.meals) {
    const get = k => { const el = $(m + "-" + k); return el ? el.value.trim() : "0"; };
    const picked = document.querySelector('input[name="' + m + '-k"]:checked');
    const a = d.kidsOnly ? "0" : get("a"), k = d.kidsOnly ? (picked ? picked.value : "") : get("k");
    if (d.kidsOnly && !ok(k)) {
      msg.textContent = "Please choose Coming or Not coming for each meal.";
      msg.classList.add("err"); return;
    }
    [["a", a], ["k", k]].forEach(([kind, v]) => { if (!ok(v) && $(m + "-" + kind)) bad.push($(m + "-" + kind)); });
    counts[m] = { a: +a, k: +k };
  }
  if (bad.length) {
    // Every empty box turns red, and its grey hint below turns red too.
    bad.forEach(i => { i.classList.add("invalid"); i.parentNode.querySelector(".help").classList.remove("hidden"); });
    bad[0].scrollIntoView({ behavior: "smooth", block: "center" });
    msg.textContent = "Please check the highlighted fields.";
    msg.classList.add("err"); return;
  }
  $("send-btn").disabled = true; msg.textContent = "Sending…";
  try {
    const res = await api(null, { action: "submit", first: guest.first, last: guest.last, counts });
    if (res.status !== "ok") throw new Error(res.status);
    d.previous = counts;
    renderSummary(counts);
    show("step-done");
  } catch (err) {
    msg.textContent = "We couldn't save your answer. Please try again."; msg.classList.add("err");
  } finally {
    $("send-btn").disabled = false;
  }
});

function renderSummary(counts) {
  const d = guest.data, ul = $("summary");
  ul.innerHTML = "";
  d.meals.forEach(m => {
    const c = counts[m];
    const parts = [];
    if (!d.kidsOnly) parts.push(c.a + (c.a === 1 ? " adult" : " adults"));
    if (!d.kidsOnly) parts.push(c.k + (c.k === 1 ? " kid" : " kids"));
    else parts.push("Coming");
    const total = c.a + c.k;
    const li = document.createElement("li");
    const a = document.createElement("span"); a.textContent = d.mealInfo[m].title;
    const b = document.createElement("span"); b.textContent = total ? parts.join(", ") : "Not attending";
    li.append(a, b);
    if (total && CAL[m]) li.append(calLinks(m));
    ul.append(li);
  });
}

// One calendar event per meal. Static .ics files live in cal/ (keep times in sync).
const CAL = {
  Brunch: { file: "cal/brunch.ics", title: "Daniel's Bar Mitzvah · Sunday Brunch", start: "20261206T163000Z", end: "20261206T193000Z",
    loc: "Midrasho Shel Shem, 987 Schumacher Dr, Los Angeles, CA", details: "Tefillin & First Aliyah at 8:30 AM, brunch to follow." },
  Dinner: { file: "cal/dinner.ics", title: "Daniel's Bar Mitzvah · Friday Dinner", start: "20261212T001500Z", end: "20261212T043000Z",
    loc: "Midrasho Shel Shem, 987 Schumacher Dr, Los Angeles, CA", details: "Kabbalat Shabbat at 4:15 PM, celebratory dinner at 5:45 PM." },
  Lunch: { file: "cal/lunch.ics", title: "Daniel's Bar Mitzvah · Shabbat Lunch", start: "20261212T204500Z", end: "20261212T233000Z",
    loc: "Shiloh's, 8939 W Pico Blvd, Los Angeles, CA",
    details: "Celebratory lunch at 12:45 PM at Shiloh's. Before: prayers 9:00 AM and Torah reading 10:00 AM at Midrasho Shel Shem, 987 Schumacher Dr." },
  Kidush: { file: "cal/kidush.ics", title: "Daniel's Bar Mitzvah · Shabbat Kidush", start: "20261212T170000Z", end: "20261212T203000Z",
    loc: "Midrasho Shel Shem, 987 Schumacher Dr, Los Angeles, CA", details: "Prayers 9:00 AM, Torah reading 10:00 AM, Kidush to follow." }
};

function calLinks(m) {
  const ev = CAL[m], box = el("div", "cal");
  const apple = el("a", "", "Apple / Outlook");
  apple.href = ev.file; // no download attr: lets iPhone open it straight in Calendar
  const google = el("a", "", "Google Calendar");
  google.href = "https://calendar.google.com/calendar/render?" + new URLSearchParams({
    action: "TEMPLATE", text: ev.title, dates: ev.start + "/" + ev.end, location: ev.loc,
    details: ev.details + "\n\nChange your RSVP: https://toobs4.github.io/daniel/"
  });
  google.target = "_blank"; google.rel = "noopener";
  apple.setAttribute("aria-label", "Add " + d_title(m) + " to Apple or Outlook calendar");
  google.setAttribute("aria-label", "Add " + d_title(m) + " to Google Calendar");
  box.append(apple, google);
  return box;
}
const d_title = m => (guest && guest.data.mealInfo[m] ? guest.data.mealInfo[m].title : m);

$("edit-btn").addEventListener("click", () => { $("send-msg").textContent = ""; renderInvite(); });

async function withdraw(btn) {
  if (!confirm("Withdraw your answer? It will be removed and you can reply again later.")) return;
  btn.disabled = true;
  try {
    const res = await api(null, { action: "withdraw", first: guest.first, last: guest.last });
    if (res.status !== "ok") throw new Error(res.status);
    guest = null;
    $("first").value = ""; $("last").value = "";
    const msg = $("find-msg"); msg.className = "msg"; msg.textContent = "Your answer has been withdrawn.";
    show("step-find");
  } catch (err) {
    alert("We couldn't withdraw your answer. Please try again.");
  } finally {
    btn.disabled = false;
  }
}
$("withdraw-btn").addEventListener("click", e => withdraw(e.currentTarget));
$("withdraw-btn2").addEventListener("click", e => withdraw(e.currentTarget));
$("not-me").addEventListener("click", () => {
  guest = null; $("first").value = ""; $("last").value = ""; $("find-msg").textContent = ""; show("step-find");
});
</script>
</body>
</html>
